name: CI Voll Med

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs: 
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Configure JDK 17
      uses: actions/setup-java@v4
      with: 
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Docker Compose Version
      run: docker compose version

    - name: Runs docker compose
      run: docker compose up -d

    - name: Executa testes unitarios
      run: mvn -B verify

    - name: Build Jacoco Report
      run: mvn jacoco:prepare-agent verify

    - name: Static analyze
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: mvn sonar:sonar -Dsonar.projectKey=felipeazsantos_vollmed-api
      





      
  
